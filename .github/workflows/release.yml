name: Release

# A release is published when the version in Cargo.toml has no GitHub release yet: bump the version
# and CHANGELOG.md on main and this workflow builds the Windows package, creates the vX.Y.Z tag at
# that commit and publishes the release (notes come from the matching CHANGELOG.md section).
# Pushing a vX.Y.Z tag by hand works too.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.+)"/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" >/dev/null 2>&1; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Backfill the v0.1.0 baseline release (once)
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --target 92ad09b1d33417a7bbdb4be164804479257d8682 \
            --title "Kira v0.1.0" --notes "Baseline release: syslog collector, SFOS parser, Postgres storage with hourly rollups, dashboards, event explorer, retention and CSV export. Source only; use v0.2.0 or newer for the Windows package."

  windows-package:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag matches the Cargo version
        shell: pwsh
        run: |
          $tag = "${{ needs.detect.outputs.version }}"
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tag -ne $ver) { throw "Tag $tag does not match Cargo.toml version $ver" }
      - run: cargo build --release --locked
      - run: npm ci && npm run build
        working-directory: web
      - name: Package
        shell: pwsh
        run: |
          $name = "kira-v${{ needs.detect.outputs.version }}-windows-x64"
          $d = "dist\$name"
          New-Item -ItemType Directory -Force "$d\target\release", "$d\web", "$d\scripts\windows" | Out-Null
          Copy-Item target\release\sfos-api.exe, target\release\sfos-ingest.exe "$d\target\release"
          Copy-Item web\dist "$d\web\dist" -Recurse
          Copy-Item scripts\windows\kira.ps1 "$d\scripts\windows"
          Copy-Item kira.env.example, README.md, CHANGELOG.md "$d"
          Copy-Item docs "$d\docs" -Recurse
          Compress-Archive -Path "$d" -DestinationPath "dist\$name.zip"
          "ZIP=dist\$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $ver = "${{ needs.detect.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]").LineNumber
          if (-not $start) { "Release $ver" | Set-Content notes.md; exit 0 }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^(## \[|\[.+\]: )' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content notes.md
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ needs.detect.outputs.version }}"
          $pre = if ($tag -match '-') { '--prerelease' } else { '' }
          gh release create $tag $env:ZIP --target "${{ github.sha }}" --title "Kira $tag" --notes-file notes.md $pre
