name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (tests + Postgres migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build
        working-directory: web

  e2e:
    name: End-to-end (native binaries, auth, syslog pipeline)
    runs-on: ubuntu-latest
    needs: [rust, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      ADMIN_PASSWORD: ci-admin-password-123
      DROP_NOISE: conn_start,ip_spoof_broadcast
      API_ADDR: 127.0.0.1:8080
      SYSLOG_UDP_ADDR: 127.0.0.1:5514
      SYSLOG_TCP_ADDR: 127.0.0.1:5514
      HEALTH_ADDR: 127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo build --release --locked
      - name: Start collector and API
        run: |
          nohup target/release/sfos-ingest > ingest.log 2>&1 &
          sleep 3
          WEB_DIR=web/dist nohup target/release/sfos-api > api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat ingest.log api.log
          exit 1
      - name: Replay sanitized Sophos capture
        run: python3 scripts/replay-real-log.py fw1_samples.log --port 5514 --collector http://127.0.0.1:8081 --rebase
      - name: Auth + ingest pipeline checks
        run: >
          python3 scripts/e2e-check.py --api http://127.0.0.1:8080 --collector http://127.0.0.1:8081
          --syslog 127.0.0.1:5514 --user admin --password "$ADMIN_PASSWORD" --drop-noise "$DROP_NOISE"
      - name: Logs on failure
        if: failure()
        run: tail -n 100 ingest.log api.log

  windows:
    name: Windows native install (kira.ps1 end to end)
    runs-on: windows-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure
        shell: pwsh
        run: |
          (Get-Content kira.env.example) -replace '^ADMIN_PASSWORD=.*', 'ADMIN_PASSWORD=ci-admin-password-123' | Set-Content kira.env
      - name: Build
        shell: pwsh
        run: .\scripts\windows\kira.ps1 build
      # The runner ends a step's background processes when the step finishes, so start, test and stop
      # have to happen inside one step.
      - name: Init, start, run checks, stop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\windows\kira.ps1 init
          .\scripts\windows\kira.ps1 start
          .\scripts\windows\kira.ps1 status
          try {
            .\scripts\windows\kira.ps1 doctor
            .\scripts\windows\kira.ps1 backup
            if (-not (Get-ChildItem .runtime\backups -Filter 'kira-*.dump')) { throw 'backup file missing' }
          } catch { throw "doctor failed: $_" }
          try {
            python scripts/replay-real-log.py fw1_samples.log --port 5514 --collector http://127.0.0.1:8081 --rebase
            if ($LASTEXITCODE -ne 0) { throw 'replay failed' }
            python scripts/e2e-check.py --api http://127.0.0.1:8080 --collector http://127.0.0.1:8081 --syslog 127.0.0.1:5514 --user admin --password ci-admin-password-123 --drop-noise conn_start,ip_spoof_broadcast
            if ($LASTEXITCODE -ne 0) { throw 'e2e checks failed' }
          } finally {
            .\scripts\windows\kira.ps1 stop
          }
      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: Get-ChildItem .runtime\logs\*.log | ForEach-Object { "=== $($_.Name)"; Get-Content $_ -Tail 60 }
