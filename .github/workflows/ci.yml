name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (tests + Postgres migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build
        working-directory: web

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  e2e:
    name: End-to-end (Docker stack, auth, syslog pipeline)
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      ADMIN_PASSWORD: ci-admin-password-123
      DROP_NOISE: conn_start,ip_spoof_broadcast
      API_PORT: "8082"
      INGEST_HEALTH_PORT: "8083"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API and collector
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8082/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8083/healthz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail=100
          exit 1
      - name: Replay sanitized Sophos capture
        run: python3 scripts/replay-real-log.py fw1_samples.log --port 5514 --collector http://127.0.0.1:8083 --rebase
      - name: Auth + ingest pipeline checks
        run: >
          python3 scripts/e2e-check.py --api http://127.0.0.1:8082 --collector http://127.0.0.1:8083
          --syslog 127.0.0.1:5514 --user admin --password "$ADMIN_PASSWORD" --drop-noise "$DROP_NOISE"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
